# ==============================================================================
# VeriQuery / Amypo-SentinelQA - Docker Compose
# HackWithAMYPO 2026: Merged Problem Statements PS7 & PS2
# Strict 8GB RAM Budget & Zero Third-Party API Architecture
# ==============================================================================
version: '3.8'

services:
  veriquery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veriquery-engine
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3:8b-instruct-q4_K_M
      - EMBEDDING_MODEL_NAME=all-MiniLM-L6-v2
      - NLI_MODEL_NAME=cross-encoder/nli-deberta-v3-small
      - RAM_LIMIT_GB=8.0
      - MAX_LATENCY_BUDGET_SEC=10.0
    volumes:
      # Persistent local storage for vector database and documents
      - ./backend/data:/app/backend/data
    deploy:
      resources:
        limits:
          memory: 8192M
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: veriquery-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 5120M
    restart: unless-stopped

volumes:
  ollama_models:
    name: veriquery_ollama_models
